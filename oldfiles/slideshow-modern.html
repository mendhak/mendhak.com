<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mendhak / Photos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* Slideshow container */
        .slideshow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Individual slide */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.8s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            display: block;
        }

        .slide img.portrait {
            width: auto;
            height: 100vh;
            max-width: none;
        }

        .slide img.landscape {
            width: 100%;
            height: auto;
            max-height: none;
        }

       

       
    </style>
</head>
<body>
    <div class="slideshow-container" id="slideshow"></div>

   

    <script>

        const config = {
           
            slideInterval: 8000,
           
        };

        // State
        let currentSlide = 0;
        let slides = [];
        let isPlaying = true;
        let intervalId = null;


        async function init() {
            await loadImages();
            
            createSlides();
            
            showSlide(0);
            startSlideshow();
            

        }

        async function loadImages() {
            const imagePaths = [
                'https://live.staticflickr.com/65535/55040582231_7109e4e564_k.jpg',
                'https://live.staticflickr.com/65535/55122400904_7c4f800696_k.jpg',
                'https://live.staticflickr.com/65535/55154541090_26deecf10a_h.jpg'
                // Generate this array via GHA?
            ];

            for (const path of imagePaths) {
                try {
                    const img = await loadImage(path);
                    // Determine if portrait or landscape
                    const isPortrait = img.height > img.width;
                    slides.push({
                        src: path,
                        caption: '',
                        orientation: isPortrait ? 'portrait' : 'landscape'
                    });
                } catch (error) {
                    console.warn(`Failed to load ${path}:`, error);
                }
            }
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        function createSlides() {
            const container = document.getElementById('slideshow');
            container.innerHTML = '';

            slides.forEach((slide, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide';
                if (index === 0) slideDiv.classList.add('active');

                const img = document.createElement('img');
                img.src = slide.src;
                img.alt = slide.caption || 'Photo';
                
                // Add orientation class for proper sizing
                if (slide.orientation === 'portrait') {
                    img.classList.add('portrait');
                } else {
                    img.classList.add('landscape');
                }

                slideDiv.appendChild(img);
                container.appendChild(slideDiv);
            });
        }

        // Show specific slide
        function showSlide(index) {
            if (slides.length === 0) return;

            currentSlide = index;

            const allSlides = document.querySelectorAll('.slide');
            allSlides.forEach(slide => slide.classList.remove('active'));

            const activeSlide = allSlides[index];
            if (activeSlide) {
                activeSlide.classList.add('active');
            }
        }

        // Start/stop slideshow
        function startSlideshow() {
            if (intervalId) clearInterval(intervalId);
            
            intervalId = setInterval(() => {
                let nextSlide = (currentSlide + 1) % slides.length;
                console.log(nextSlide);
                showSlide(nextSlide);
            }, config.slideInterval);
        }
   

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
